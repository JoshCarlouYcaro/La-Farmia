<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Farmia - Hero Section</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter and Playfair Display for high-end serif look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-serif-custom {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-black text-white antialiased overflow-x-hidden">

    <section class="relative w-full h-screen min-h-[700px] flex flex-col justify-between overflow-hidden bg-zinc-950">
        
        <!-- Background Image with Dark Gradient Overlay for optimal text readability -->
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=2000&auto=format&fit=crop" 
                 alt="Rural farm at sunset" 
                 class="w-full h-full object-cover object-center scale-105 animate-pulse duration-[10000ms]"
                 onerror="this.src='https://placehold.co/1920x1080/1a1a1a/ffffff?text=La+Farmia+Background'">
            <!-- Heavy dark gradient overlays to match the reference image mood -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-black/30"></div>
            <div class="absolute inset-0 bg-zinc-950/30 backdrop-brightness-90"></div>
        </div>

        <div class="relative z-10 max-w-7xl mx-auto w-full px-6 sm:px-12 pt-32 sm:pt-40 flex flex-col items-start justify-center flex-grow">
            
            <!-- Overline with horizontal line accent -->
            <div class="flex items-center space-x-4 mb-4">
                <span class="h-[1px] w-12 sm:w-16 bg-pink-300/80"></span>
                <span class="text-xs sm:text-sm font-medium tracking-[0.25em] text-zinc-200 uppercase">
                    A STORY ROOTED IN THE LAND
                </span>
            </div>

            <!-- Main Headline -->
            <h1 class="font-serif-custom text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-normal tracking-tight max-w-4xl text-white mb-6 leading-[1.08]">
                From the land, <br>
                <span class="italic font-light text-pink-200">with purpose.</span>
            </h1>

            <!-- Supporting Description Paragraph -->
            <p class="text-zinc-300 text-base sm:text-lg md:text-xl font-light max-w-xl leading-relaxed mb-10">
                Come along on the La Farmia journey — from life on the farm to the care behind every step, and onward to you.
            </p>

            <!-- Pill-shaped Interactive Button -->
            <div>
                <a href="#explore" class="group inline-flex items-center justify-between bg-zinc-100/95 hover:bg-white text-zinc-900 text-sm font-medium px-7 py-4 rounded-full transition-all duration-300 shadow-lg hover:shadow-xl hover:scale-[1.02] active:scale-[0.98]">
                    <span class="tracking-wide">EXPLORE THE JOURNEY</span>
                    <span class="ml-3 w-7 h-7 rounded-full bg-zinc-200/60 group-hover:bg-zinc-300 flex items-center justify-center transition-colors">
                        <svg class="w-3.5 h-3.5 text-zinc-800 transform group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </span>
                </a>
            </div>

        </div>

        <div class="relative z-10 max-w-7xl mx-auto w-full px-6 sm:px-12 pb-8 flex flex-col sm:flex-row items-start sm:items-end justify-between text-xs sm:text-sm tracking-[0.2em] text-zinc-400 font-medium gap-4">
            
            <!-- Bottom Left Categories -->
            <div class="flex items-center space-x-3 text-zinc-300">
                <span>FARM</span>
                <span class="text-pink-400/80">&middot;</span>
                <span>PROCESS</span>
                <span class="text-pink-400/80">&middot;</span>
                <span>DELIVERY</span>
            </div>

            <!-- Bottom Right Scroll Indicator -->
            <div class="flex items-center space-x-2 text-zinc-300 cursor-pointer hover:text-white transition-colors">
                <span>SCROLL TO DISCOVER</span>
                <svg class="w-4 h-4 animate-bounce text-pink-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                </svg>
            </div>

        </div>

    </section>

    <script>
        // Smooth scroll behavior for explore button
        document.querySelector('a[href="#explore"]').addEventListener('click', function(e) {
            e.preventDefault();
            window.scrollTo({
                top: window.innerHeight,
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
